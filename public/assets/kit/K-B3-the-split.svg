<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" width="640" height="228" fill="none" stroke="#E9E5DA" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter" role="img" aria-label="The split: prior to doc and prior to close, with the one question as the rule between them">
<title>The split: prior to doc and prior to close, with the one question as the rule between them</title>
<style>
  .d { animation: fb-draw 0.4s cubic-bezier(0.8, 0.02, 0.18, 1) forwards; }
  .r { animation-timing-function: cubic-bezier(0.34, 0.9, 0.2, 1); animation-duration: 0.14s; }
  @keyframes fb-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .d { animation: none; stroke-dashoffset: 0; } }
</style>
<g font-family="'Fragment Mono', 'SF Mono', Menlo, monospace" font-size="11" fill="#E9E5DA" stroke="none">
  <text x="0" y="16">PRIOR TO DOC</text><text x="640" y="16" text-anchor="end">PRIOR TO CLOSE</text>
</g>
<line class="d" stroke-dasharray="300" stroke-dashoffset="300" x1="0" y1="24" x2="300" y2="24"/>
<line class="d" stroke-dasharray="300" stroke-dashoffset="300" x1="340" y1="24" x2="640" y2="24"/>
<line class="d" stroke-dasharray="176" stroke-dashoffset="176" style="animation-delay:0.2s" x1="320" y1="24" x2="320" y2="200"/>
<rect x="240" y="124" width="160" height="66" fill="#1A1B1D"/>
<g font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#E9E5DA" stroke="none" text-anchor="middle">
  <text x="320" y="144">could clearing it</text><text x="320" y="158">change the approval?</text>
  <text x="320" y="178" fill="#9A9C98">yes, left. no, right.</text>
</g>
<g class="d" stroke-dasharray="600" stroke-dashoffset="600" style="animation-delay:0.5s"><rect x="0" y="40" width="300" height="32"/></g>
<text x="8" y="60" text-anchor="start" font-family="'Fragment Mono', 'SF Mono', Menlo, monospace" font-size="10" fill="#E9E5DA" stroke="none" >PTD 01</text><text x="60" y="60" text-anchor="start" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#E9E5DA" stroke="none" >Signed 1040 with all schedules for 2024 and 2025.</text>
<g class="d" stroke-dasharray="600" stroke-dashoffset="600" style="animation-delay:0.7s"><rect x="0" y="80" width="300" height="32"/></g>
<text x="8" y="100" text-anchor="start" font-family="'Fragment Mono', 'SF Mono', Menlo, monospace" font-size="10" fill="#E9E5DA" stroke="none" >PTD 02</text><text x="60" y="100" text-anchor="start" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#E9E5DA" stroke="none" >Year to date profit and loss statement.</text>
<g class="d" stroke-dasharray="600" stroke-dashoffset="600" style="animation-delay:0.9s"><rect x="340" y="40" width="300" height="32"/></g>
<text x="348" y="60" text-anchor="start" font-family="'Fragment Mono', 'SF Mono', Menlo, monospace" font-size="10" fill="#E9E5DA" stroke="none" >PTC 01</text><text x="400" y="60" text-anchor="start" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#E9E5DA" stroke="none" >Verbal verification of employment.</text>
<line class="d" stroke-dasharray="640" stroke-dashoffset="640" style="animation-delay:1.1s" x1="0" y1="200" x2="640" y2="200"/>
<text x="0" y="218" text-anchor="start" font-family="'Fragment Mono', 'SF Mono', Menlo, monospace" font-size="10" fill="#9A9C98" stroke="none" >a figure can still move on the left; on the right the figures are settled and the file is confirmed</text>
</svg>
